name: ChartAgent Runtime Diagnostics
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect SOXL news without changing runtime
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
            cd /opt/facemaxx
            docker compose exec -T chartagent-api python - <<'PYCODE'
          import anyio, json, time
          from datetime import datetime, UTC, timedelta
          from app.config import get_settings
          from app.insightsentry import InsightSentryClient, _news_asset_root, _NewsPayload, _select_recent_news
          async def inspect():
              settings = get_settings()
              connection = settings.insightsentry_connection
              print('news_probe_config', json.dumps({'configured': connection is not None, 'host': connection.base_url if connection else None}), flush=True)
              client = InsightSentryClient(settings)
              for code, name in [('BVL:SOXLUS','SOXLUS'),('BINANCE:SOXLUSDT.P','SOXLUSDT.P')]:
                  started = time.monotonic()
                  news = await client.fetch_news(code, name)
                  print('news_collection_verified', json.dumps({'code':code,'news_root':_news_asset_root(code),'count':len(news),'elapsed':round(time.monotonic()-started,2),'titles':[item.title for item in news]}), flush=True)
                  assert _news_asset_root(code) == 'SOXL'
                  assert news, 'Expected the SOXL story observed before deployment'
          anyio.run(inspect)
          PYCODE
          REMOTE
