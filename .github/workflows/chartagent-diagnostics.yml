name: ChartAgent Runtime Diagnostics

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read ChartAgent provider status
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/ec2_key -r briefing-deploy/. "$EC2_USER@$EC2_HOST:/tmp/chartagent-briefing-20261105"
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" 'curl -fsS http://127.0.0.1:8010/health; docker run --rm --env-file /opt/chartagent/.env -e PYTHONPATH=/app chartagent-briefing:20261105 python -c "import app.main"' 
