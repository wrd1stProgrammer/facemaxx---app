name: ChartAgent Runtime Diagnostics

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read ChartAgent provider status
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
            cd /opt/facemaxx
            docker inspect chartagent-api --format '{{.Config.Image}} {{.Image}}'
            docker compose exec -T chartagent-api python - <<'PYCODE'
          import importlib.util, pathlib, hashlib
          from zoneinfo import ZoneInfo
          print('timezone',ZoneInfo('America/New_York'))
          for name in ['main.py','briefings.py','multi_timeframe.py','insightsentry.py','news_workspace.py']:
              p=pathlib.Path('/app/app')/name
              print(name, p.exists(), hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else '')
          print('MAIN_START')
          print(pathlib.Path('/app/app/main.py').read_text()[:4200])
          print('MAIN_END')
          from app.config import get_settings
          s=get_settings()
          print('provider_configured', bool(s.insightsentry_connection),bool(s.openai_api_key))
          print('http2',importlib.util.find_spec('h2') is not None)
          print('jwt',importlib.util.find_spec('jwt') is not None)
          PYCODE
          REMOTE
