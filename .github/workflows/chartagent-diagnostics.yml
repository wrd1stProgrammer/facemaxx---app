name: ChartAgent Runtime Diagnostics

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read ChartAgent provider status
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
            cd /opt/facemaxx
            docker compose exec -T chartagent-api codex --version </dev/null
            docker compose logs --since=30m chartagent-api 2>&1 \
              | grep -E 'Codex CLI failed|OpenAI fallback (failed|incomplete|validation failed)' \
              | tail -30 || true
            docker compose exec -T chartagent-api python - <<'PYCODE'
          import anyio
          from pydantic import BaseModel
          from app.chart_annotations import _codex, _fallback
          from app.config import get_settings
          class Probe(BaseModel):
              ok: bool
          async def inspect():
              print("annotation_primary", get_settings().chart_annotation_provider, flush=True)
              for name, provider in [("annotation_codex", _codex), ("annotation_fallback", _fallback)]:
                  print(name, "model", provider.model, "reasoning", provider.reasoning_effort, flush=True)
                  try:
                      result = await provider.complete(prompt='Return {"ok":true}. Do not use tools.', image_path=None, response_model=Probe)
                      print(name, "ok", result.ok, flush=True)
                  except Exception as error:
                      cause = error.__cause__
                      print(name, "failure", type(error).__name__, getattr(error, "reason", None),
                            "cause", type(cause).__name__, "status", getattr(cause, "status_code", None),
                            "code", getattr(cause, "code", None), flush=True)
          anyio.run(inspect)
          PYCODE
          REMOTE
