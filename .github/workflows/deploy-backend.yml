name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "chartagent_backend/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/ec2/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

env:
  FACEMAXX_IMAGE_NAME: facemaxx
  CHARTAGENT_IMAGE_NAME: chartagent

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Docker Hub image
        id: dockerhub
        shell: bash
        run: |
          USERNAME="$(printf '%s' '${{ secrets.DOCKERHUB_USERNAME }}' | tr -d '[:space:]')"
          if [ -z "$USERNAME" ]; then
            echo "DOCKERHUB_USERNAME secret is empty" >&2
            exit 1
          fi
          echo "::add-mask::$USERNAME"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "facemaxx_image=$USERNAME/${{ env.FACEMAXX_IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "chartagent_image=$USERNAME/${{ env.CHARTAGENT_IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push FaceMaxx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.dockerhub.outputs.facemaxx_image }}:latest
            ${{ steps.dockerhub.outputs.facemaxx_image }}:${{ github.sha }}

      - name: Build and push ChartAgent image
        uses: docker/build-push-action@v6
        with:
          context: ./chartagent_backend
          file: ./chartagent_backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.dockerhub.outputs.chartagent_image }}:latest
            ${{ steps.dockerhub.outputs.chartagent_image }}:${{ github.sha }}

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload compose file
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "sudo mkdir -p /opt/facemaxx && sudo chown ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /opt/facemaxx"
          scp -i ~/.ssh/ec2_key \
            deploy/ec2/docker-compose.yml \
            deploy/ec2/install-chartagent-nginx.sh \
            deploy/ec2/nginx-chartagent.conf.example \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/facemaxx/"

      - name: Log in to Docker Hub on EC2
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "printf '%s' '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ steps.dockerhub.outputs.username }}' --password-stdin"

      - name: Configure ChartAgent product analytics
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.CHARTAGENT_POSTHOG_PROJECT_TOKEN }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$POSTHOG_PROJECT_TOKEN" ]; then exit 0; fi
          umask 077
          printf 'CHARTAGENT_POSTHOG_PROJECT_TOKEN=%s\nCHARTAGENT_POSTHOG_HOST=https://us.i.posthog.com\n' "$POSTHOG_PROJECT_TOKEN" > /tmp/chartagent-posthog.env
          scp -i ~/.ssh/ec2_key /tmp/chartagent-posthog.env "$EC2_USER@$EC2_HOST:/tmp/chartagent-posthog.env"
          rm /tmp/chartagent-posthog.env
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" 'sudo python3 -' <<'PY'
          from pathlib import Path
          source = Path('/tmp/chartagent-posthog.env')
          target = Path('/opt/chartagent/.env')
          lines = [line for line in target.read_text().splitlines() if not line.startswith(('CHARTAGENT_POSTHOG_PROJECT_TOKEN=', 'CHARTAGENT_POSTHOG_HOST='))]
          target.write_text('\n'.join(lines) + '\n' + source.read_text())
          source.unlink()
          PY

      - name: Pull and restart container
        run: |
          FACEMAXX_IMAGE="${{ steps.dockerhub.outputs.facemaxx_image }}:${{ github.sha }}"
          CHARTAGENT_IMAGE="${{ steps.dockerhub.outputs.chartagent_image }}:${{ github.sha }}"
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "FACEMAXX_IMAGE='$FACEMAXX_IMAGE' CHARTAGENT_IMAGE='$CHARTAGENT_IMAGE' bash -se" <<'REMOTE'
            cd /opt/facemaxx
            echo "Disk usage before Docker cleanup:"
            df -h / /var/lib/docker /var/lib/containerd 2>/dev/null || df -h /
            docker system df || true

            # Keep named volumes such as photo-data, but remove old stopped
            # containers, unused images, and cache so the new image can extract.
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true

            echo "Disk usage after Docker cleanup:"
            df -h / /var/lib/docker /var/lib/containerd 2>/dev/null || df -h /
            docker system df || true

            tmp="$(mktemp)"
            if [ -f .env ]; then
              grep -Ev '^(FACEMAXX_IMAGE|CHARTAGENT_IMAGE)=' .env > "$tmp"
            fi
            printf '\nFACEMAXX_IMAGE=%s\n' "$FACEMAXX_IMAGE" >> "$tmp"
            printf 'CHARTAGENT_IMAGE=%s\n' "$CHARTAGENT_IMAGE" >> "$tmp"
            mv "$tmp" .env
            chmod 600 .env
            if [ ! -f /opt/chartagent/.env ]; then
              echo "/opt/chartagent/.env is missing" >&2
              exit 1
            fi
            sudo chown root:docker /opt/chartagent/.env
            sudo chmod 640 /opt/chartagent/.env
            docker compose pull
            docker compose up -d --remove-orphans
            sudo bash /opt/facemaxx/install-chartagent-nginx.sh
            docker image prune -af || true
          REMOTE

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            cd /opt/facemaxx
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null \
                && curl -fsS http://127.0.0.1:8010/health >/dev/null; then
                exit 0
              fi
              sleep 2
            done

            echo "Deployment health check failed. Container status:"
            docker compose ps
            echo "Recent container logs:"
            docker compose logs --tail=120 api chartagent-api
            exit 1
          '
