services:
  api:
    image: ${FACEMAXX_IMAGE:-wrd1stprogrammer/facemaxx:latest}
    container_name: facemaxx-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - photo-data:/app/.data
      - codex-home:/home/app/.codex
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  chartagent-api:
    image: ${CHARTAGENT_IMAGE:-wrd1stprogrammer/chartagent:latest}
    container_name: chartagent-api
    restart: unless-stopped
    env_file:
      - /opt/chartagent/.env
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - codex-home:/home/app/.codex
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  photo-data:
  codex-home:
